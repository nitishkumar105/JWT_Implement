<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        .container { padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Your Password</h2>
    <input type="password" id="newPassword" placeholder="New Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button onclick="resetPassword()">Reset Password</button>
    <p id="message"></p>
</div>

<script>
    function getTokenFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('token');
    }

    function resetPassword() {
        const token = getTokenFromURL();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            document.getElementById('message').innerText = "Passwords don't match!";
            return;
        }

        fetch('http://localhost:8080/api/password/reset', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                token: token,
                newPassword: newPassword
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('message').innerText = data.message || "Password reset successfully!";
        })
        .catch(error => {
            document.getElementById('message').innerText = "Error resetting password.";
        });
    }
</script>
</body>
</html>
